name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and Android SDK into Buildozer's expected path
        run: |
          # System packages
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk wget

          # Create Buildozer's expected SDK directory
          mkdir -p ~/.buildozer/android/platform/android-sdk
          cd ~/.buildozer/android/platform/android-sdk

          # Download and extract command-line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip

          # Rename cmdline-tools to tools (Buildozer expects tools/bin/sdkmanager)
          mv cmdline-tools tools
          rm commandlinetools-linux-11076708_latest.zip

          # Set environment variables for this session
          export ANDROID_HOME=~/.buildozer/android/platform/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$PATH:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/30.0.3

          # Accept licenses and install build-tools 30.0.3 (Buildozer's default)
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "build-tools;30.0.3" "platforms;android-33"

          # Verify aidl is present
          ls -la $ANDROID_HOME/build-tools/30.0.3/aidl

          # Install Python build tools
          pip install --upgrade pip
          pip install buildozer cython

          # Create buildozer.spec
          echo '[app]' > buildozer.spec
          echo 'title = Currency Converter' >> buildozer.spec
          echo 'package.name = currencyconverter' >> buildozer.spec
          echo 'package.domain = org.ymnab' >> buildozer.spec
          echo 'version = 1.0.0' >> buildozer.spec
          echo 'source.dir = .' >> buildozer.spec
          echo 'requirements = python3,kivy,requests' >> buildozer.spec
          echo 'orientation = portrait' >> buildozer.spec
          echo 'android.sdk_version = 30' >> buildozer.spec
          echo 'android.ndk_version = 23b' >> buildozer.spec
          echo 'android.permissions = INTERNET' >> buildozer.spec
          echo 'android.enable_androidx = True' >> buildozer.spec
          echo 'android.min_sdk_version = 21' >> buildozer.spec
          echo 'android.target_sdk_version = 30' >> buildozer.spec
          echo 'android.ndk_abi = arm64-v8a' >> buildozer.spec
          echo 'android.python_version = 3' >> buildozer.spec
          echo 'android.build_tools_version = 30.0.3' >> buildozer.spec

          # Build the APK
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CurrencyConverter
          path: bin/*.apk

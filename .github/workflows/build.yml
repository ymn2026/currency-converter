name: Build APK with Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK inside Docker
        run: |
          docker run --rm \
            -v $(pwd):/app \
            -w /app \
            ymorin/buildozer:latest \
            buildozer -v android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CurrencyConverter
          path: bin/*.apk

name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and Android SDK
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk wget

          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          rm commandlinetools-linux-11076708_latest.zip

          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "build-tools;37.0.0" "platforms;android-33"

          pip install --upgrade pip
          pip install buildozer cython

      - name: Create buildozer.spec and build APK
        run: |
          # Create the spec file directly in the repository root
          cat > buildozer.spec << 'SPEC'
[app]
title = Currency Converter
package.name = currencyconverter
package.domain = org.ymnab
version = 1.0.0
source.dir = .
requirements = python3,kivy,requests
orientation = portrait
android.sdk_version = 30
android.ndk_version = 23b
android.permissions = INTERNET
android.enable_androidx = True
android.min_sdk_version = 21
android.target_sdk_version = 30
android.ndk_abi = arm64-v8a
android.python_version = 3
SPEC

          # List files to confirm
          ls -la

          # Build
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CurrencyConverter
          path: bin/*.apk

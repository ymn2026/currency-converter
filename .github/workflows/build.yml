name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies, SDK, and Build APK
        run: |
          # System packages
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk wget

          # Create Buildozer's expected SDK directory
          SDK_ROOT=~/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_ROOT
          cd $SDK_ROOT

          # Download command-line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip

          # Create the nested structure Google expects: cmdline-tools/latest
          mkdir -p cmdline-tools
          mv cmdline-tools cmdline-tools/latest

          # Create a symlink 'tools' that points to cmdline-tools/latest (Buildozer expects tools/bin/sdkmanager)
          ln -s cmdline-tools/latest tools

          # Clean up zip
          rm commandlinetools-linux-11076708_latest.zip

          # Set environment variables
          export ANDROID_HOME=$SDK_ROOT
          export ANDROID_SDK_ROOT=$SDK_ROOT
          export PATH=$PATH:$SDK_ROOT/tools/bin:$SDK_ROOT/platform-tools:$SDK_ROOT/build-tools/30.0.3

          # Accept licenses and install build-tools 30.0.3 (with explicit --sdk_root)
          yes | sdkmanager --sdk_root=$SDK_ROOT --licenses > /dev/null
          sdkmanager --sdk_root=$SDK_ROOT "platform-tools" "build-tools;30.0.3" "platforms;android-33"

          # Verify aidl is present
          ls -la $SDK_ROOT/build-tools/30.0.3/aidl

          # Install Python packages
          pip install --upgrade pip
          pip install buildozer cython

          # Create buildozer.spec
          echo '[app]' > buildozer.spec
          echo 'title = Currency Converter' >> buildozer.spec
          echo 'package.name = currencyconverter' >> buildozer.spec
          echo 'package.domain = org.ymnab' >> buildozer.spec
          echo 'version = 1.0.0' >> buildozer.spec
          echo 'source.dir = .' >> buildozer.spec
          echo 'requirements = python3,kivy,requests' >> buildozer.spec
          echo 'orientation = portrait' >> buildozer.spec
          echo 'android.sdk_version = 30' >> buildozer.spec
          echo 'android.ndk_version = 23b' >> buildozer.spec
          echo 'android.permissions = INTERNET' >> buildozer.spec
          echo 'android.enable_androidx = True' >> buildozer.spec
          echo 'android.min_sdk_version = 21' >> buildozer.spec
          echo 'android.target_sdk_version = 30' >> buildozer.spec
          echo 'android.ndk_abi = arm64-v8a' >> buildozer.spec
          echo 'android.python_version = 3' >> buildozer.spec
          echo 'android.build_tools_version = 30.0.3' >> buildozer.spec

          # Build the APK (Buildozer will find the SDK via the symlink)
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CurrencyConverter
          path: bin/*.apk

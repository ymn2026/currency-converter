name: Build APK with Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK inside Docker
        run: |
          docker run --rm \
            -v $(pwd):/app \
            -w /app \
            --entrypoint bash \
            kivy/buildozer:latest \
            -c "
              export ANDROID_HOME=/opt/android-sdk
              export PATH=\$PATH:\$ANDROID_HOME/tools/bin:\$ANDROID_HOME/platform-tools:\$ANDROID_HOME/build-tools/30.0.3
              yes | sdkmanager --licenses
              sdkmanager 'build-tools;30.0.3' 'platforms;android-33'
              yes | buildozer -v android debug
            "

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CurrencyConverter
          path: bin/*.apk

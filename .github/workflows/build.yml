name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and Android SDK, then build
        run: |
          # System dependencies
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk wget

          # Install Android SDK command-line tools
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          rm commandlinetools-linux-11076708_latest.zip

          # Set environment variables for the rest of the script
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/37.0.0

          # Accept licenses and install required components
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "build-tools;37.0.0" "platforms;android-33"

          # Verify aidl is present
          ls -la $ANDROID_HOME/build-tools/37.0.0/aidl

          # Install Python build tools
          pip install --upgrade pip
          pip install buildozer cython

          # Build the APK
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CurrencyConverter
          path: bin/*.apk
